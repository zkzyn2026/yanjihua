<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>研计划</title>
<meta name="author" content="张凯">
<meta name="description" content="研计划 —— 研究生专属的本地离线计划本：文献阅读、竞赛记录、项目课题、英语学习，数据全部保存在本机设备。">
<meta name="theme-color" content="#2c5aa0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="研计划">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./app.css">
<!-- pdf.js（320KB）：用 defer 异步下载、解析完 HTML 后才执行，不阻塞首屏渲染；
     worker（1.09MB）不在这里引入，由 papers.js 的 ensurePdf() 在真正导入 PDF 时才拉。
     两者都已进 sw.js 的预缓存，离线可用。 -->
<script src="./vendor/pdf.min.js" defer></script>
</head>
<body>

<header class="topbar">
  <div class="tb-side">
    <button class="tb-back" id="tb-back" hidden>‹ 返回</button>
  </div>
  <h1 class="tb-title" id="tb-title">研计划</h1>
  <div class="tb-side r">
    <button class="tb-more" id="tb-more" aria-label="更多">⋯</button>
  </div>
</header>

<div class="more-menu" id="more-menu" hidden>
  <button class="mi" data-mi="stats">统计</button>
  <button class="mi" data-mi="backup">备份与恢复</button>
  <button class="mi" data-mi="about">关于研计划</button>
  <button class="mi" data-mi="update">检查更新</button>
</div>

<main class="view" id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/></svg>
    <span>今日</span>
  </button>
  <button data-tab="papers">
    <svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.6 4 5v13c4-.4 6.5 0 8 1.4 1.5-1.4 4-1.8 8-1.4V5c-4-.4-6.5 0-8 1.5z"/><path d="M12 6.5v12"/></svg>
    <span>文献</span>
  </button>
  <button data-tab="contests">
    <svg viewBox="0 0 24 24"><path d="M8 3h8v5a4 4 0 0 1-8 0V3z"/><path d="M8 5H5.5a2.5 2.5 0 0 0 2.6 4"/><path d="M16 5h2.5a2.5 2.5 0 0 1-2.6 4"/><path d="M12 12v3M9.5 21h5M10.5 21l.5-4h2l.5 4"/></svg>
    <span>竞赛</span>
  </button>
  <button data-tab="projects">
    <svg viewBox="0 0 24 24"><path d="M9 3h6M10.5 3v5.2L5.6 17.4A2 2 0 0 0 7.4 21h9.2a2 2 0 0 0 1.8-3.6L13.5 8.2V3"/><path d="M7.5 14h9"/></svg>
    <span>课题</span>
  </button>
  <button data-tab="exams">
    <svg viewBox="0 0 24 24"><path d="M12 4L2 9l10 5 10-5-10-5z"/><path d="M6 11.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-4.5"/><path d="M21 8.5v6"/></svg>
    <span>考试</span>
  </button>
</nav>

<div class="modal" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="toast" hidden></div>
<div id="busy" hidden><div class="bx"><span class="spin"></span><span id="busy-text">处理中</span></div></div>
<!-- 这里曾经有一个「id=filepick 的隐藏文件选择元素」：它是"点了没反应"那次事故的
     老实现残留 —— 隐藏的 file input 在 iOS 上可能根本不弹窗，且复用同一个 input 会让
     取消选择后 Promise 永久悬挂。现在 UI.pickFile 每次动态创建一个可见的 1px input，
     这个死元素已删除，别再加回来（scripts/check-pickfile.js 有守卫盯着）。 -->

<script src="./config.js"></script>
<script src="./io.js"></script>
<script src="./db.js"></script>
<script src="./bib.js"></script>
<script src="./ui.js"></script>
<script src="./home.js"></script>
<script src="./papers.js"></script>
<script src="./contests.js"></script>
<script src="./projects.js"></script>
<script src="./exams.js"></script>
<script src="./stats.js"></script>
<script src="./app.js"></script>
</body>
</html>
